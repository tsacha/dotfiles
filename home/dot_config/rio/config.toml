confirm-before-quit = false
copy-on-select = true
option-as-alt = "left"

[adaptive-theme]
light = "rose-pine-dawn"
dark = "rose-pine"

[cursor]
shape = 'beam'

[fonts]
# Use the Nerd Font family (static weights only): the plain Geist Mono cask
# also ships a variable GeistMono[wght].ttf under the same family name, and
# Rio resolves it at the wrong weight (Ghostty/CoreText doesn't).
family = "GeistMono Nerd Font"
size = 22

[navigation]
unfocused-split-opacity = 1.0
hide-if-single = true

[window]
decorations = "Disabled"

[platform.macos.window]
decorations = "Enabled"
macos-use-unified-titlebar = true
mode = "Fullscreen"

[bindings]
keys = [
  # Splits
  { key = "h", with = "alt | shift", action = "SplitRight" },
  { key = "v", with = "alt | shift", action = "SplitDown" },

  # Tabs
  { key = "t", with = "alt | shift", action = "CreateTab" },
  { key = "t", with = "control | shift", action = "CreateTab" },

  # Split navigation - Rio only has cyclic next/prev, not directional
  # selection, so left/up go prev and right/down go next.
  { key = "left", with = "alt | shift", action = "SelectPrevSplit" },
  { key = "up", with = "alt | shift", action = "SelectPrevSplit" },
  { key = "right", with = "alt | shift", action = "SelectNextSplit" },
  { key = "down", with = "alt | shift", action = "SelectNextSplit" },

  # Font size (Rio has no configurable step size, unlike some terminals)
  { key = "r", with = "alt | shift", action = "IncreaseFontSize" },
  { key = "n", with = "alt | shift", action = "DecreaseFontSize" },

  # Ignore ctrl+-/ctrl++ to avoid conflicting with app-level shortcuts
  { key = "minus", with = "control", action = "None" },
  { key = "plus", with = "control", action = "None" },

  # Shift+Enter sends ESC CR (useful for multiline input in some TUIs)
  { key = "enter", with = "shift", esc = "\u001b\u000d" },
]
