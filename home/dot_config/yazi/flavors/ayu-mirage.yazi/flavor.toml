# Local Ayu Mirage Yazi flavor.
# Color palette: Ayu Mirage
# ---
# black0      "#212733" bg
# black1      "#2a3342" bg-2
# black2      "#242d3d" ui
# black3      "#303949" ui-2
# black4      "#5c6773" tx-3
# black5      "#8d96a5" tx-2-hi
# white       "#cbccc6" tx
# surface     "#303949" ui-3
# red         "#f28779" re
# orange      "#ff8f40" or
# yellow      "#ffad66" ye
# green       "#aad94c" gr
# cyan        "#95e6cb" cy
# blue        "#73d0ff" bl
# magenta     "#d4bfff" ma

[app]
overall = { bg = "#212733" } # bg

[mgr]
cwd = { fg = "#95e6cb", bold = true } # cy
hovered = { fg = "#212733", bg = "#95e6cb", bold = true } # bg, cy

# Find
find_keyword = { fg = "#ffad66", bold = true, italic = true, underline = true } # ye
find_position = { fg = "#d4bfff", bg = "reset", bold = true, italic = true } # ma
symlink_target = { italic = true }

# Marker
marker_copied = { fg = "#aad94c", bg = "#aad94c" } # gr, gr
marker_cut = { fg = "#f28779", bg = "#f28779" } # re, re
marker_marked = { fg = "#95e6cb", bg = "#95e6cb" } # cy, cy
marker_selected = { fg = "#ffad66", bg = "#ffad66" } # ye, ye

# Count
count_copied = { fg = "#212733", bg = "#aad94c", bold = true } # bg, gr
count_cut = { fg = "#212733", bg = "#f28779", bold = true } # bg, re
count_selected = { fg = "#212733", bg = "#ffad66", bold = true } # bg, ye

# Border
border_symbol = "│"
border_style = { fg = "#242d3d" } # ui
syntect_theme = ""

[indicator]
parent = { underline = true }
current = { fg = "#cbccc6", bg = "#242d3d" } # tx, ui
preview = { underline = true }
padding = { open = "█", close = "█" }

[tabs]
active = { fg = "#212733", bg = "#95e6cb", bold = true } # bg, cy
inactive = { fg = "#95e6cb", bg = "#2a3342" } # cy, bg-2
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
# Normal mode
normal_main = { fg = "#212733", bg = "#95e6cb", bold = true } # bg, cy
normal_alt = { fg = "#212733", bg = "#cbccc6", bold = true } # bg, tx

# Select mode
select_main = { fg = "#212733", bg = "#f28779", bold = true } # bg, re
select_alt = { fg = "#212733", bg = "#cbccc6", bold = true } # bg, tx

# Unset mode
unset_main = { fg = "#212733", bg = "#f28779", bold = true } # bg, re
unset_alt = { fg = "#212733", bg = "#cbccc6", bold = true } # bg, tx

[status]
overall = { fg = "#cbccc6" } # tx

# Permissions
perm_type = { fg = "#73d0ff" } # bl
perm_read = { fg = "#ffad66" } # ye
perm_write = { fg = "#f28779" } # re
perm_exec = { fg = "#aad94c" } # gr
perm_sep = { fg = "#5c6773" } # tx-2

# Progress
progress_label = { fg = "#cbccc6", bold = true } # tx
progress_normal = { fg = "#95e6cb", bg = "#2a3342" } # cy, bg-2
progress_error = { fg = "#f28779", bg = "#2a3342" } # re, bg-2

[which]
cols = 3
mask = { bg = "#2a3342" } # bg-2
cand = { fg = "#95e6cb", bold = true } # cy
rest = { fg = "#5c6773", italic = true } # tx-2
desc = { fg = "#ffad66" } # ye
separator = " "
separator_style = { }

[confirm]
border = { fg = "#303949" } # ui-2
title = { fg = "#f28779", bold = true } # re
body = { fg = "#cbccc6" } # tx
list = { fg = "#cbccc6" } # tx
btn_yes = { fg = "#212733", bg = "#95e6cb", bold = true } # bg, cy
btn_no = { fg = "#212733", bg = "#cbccc6", bold = true } # bg, tx

[spot]
border = { fg = "#303949" } # ui-2
title = { fg = "#95e6cb", bold = true } # cy
tbl_col = { fg = "#95e6cb" } # cy
tbl_cell = { fg = "#212733", bg = "#ffad66", bold = true } # bg, ye

[notify]
# Notification title
title_info = { fg = "#73d0ff" } # bl
title_warn = { fg = "#ff8f40" } # or
title_error = { fg = "#f28779" } # re

[pick]
border = { fg = "#95e6cb", bold = true } # cy
active = { fg = "#d4bfff", bold = true } # ma
inactive = { fg = "#5c6773" } # tx-2

[input]
border = { fg = "#95e6cb" } # cy
title = { fg = "#cbccc6", bold = true } # tx
value = { fg = "#cbccc6" } # tx
selected = { reversed = true } # tx, bg

[cmp]
border = { fg = "#95e6cb", bold = true } # cy
active = { fg = "#212733", bg = "#cbccc6", bold = true } # bg, tx
inactive = { fg = "#5c6773" } # tx-2

[tasks]
border = { fg = "#95e6cb" } # cy
title = { fg = "#cbccc6", bold = true } # tx
hovered = { fg = "#d4bfff", bold = true, reversed = true } # ma

[help]
on = { fg = "#73d0ff" } # bl
run = { fg = "#95e6cb" } # cy
desc = { fg = "#ffad66", italic = true } # ye
hovered = { reversed = true, bold = true }
footer = { fg = "#212733", bg = "#cbccc6", bold = true } # bg, tx

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#d4bfff" }, # ma

  # Media
  { mime = "{audio,video}/*", fg = "#ffad66" }, # ye

  # Archives
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f28779" }, # re

  # Documents
  { mime = "application/{pdf,doc,rtf}", fg = "#ff8f40" }, # or

  # Empty files
  { mime = "inode/empty", fg = "#5c6773" }, # tx-3

  # Special files
  { url = "*", is = "orphan", fg = "#212733", bg = "#f28779" }, # bg, re
  { url = "*/", is = "orphan", fg = "#212733", bg = "#f28779" }, # bg, re
  { url = "*", is = "link", fg = "#95e6cb" }, # cy
  { url = "*/", is = "link", fg = "#95e6cb" }, # cy
  { url = "*", is = "block", fg = "#cbccc6" }, # tx
  { url = "*", is = "char", fg = "#cbccc6" }, # tx
  { url = "*", is = "fifo", fg = "#d4bfff" }, # ma
  { url = "*", is = "sock", fg = "#d4bfff" }, # ma
  { url = "*", is = "sticky", fg = "#cbccc6" }, # tx
  { url = "*", is = "dummy", fg = "#212733", bg = "#f28779" }, # bg, re
  { url = "*/", is = "dummy", fg = "#212733", bg = "#f28779" }, # bg, re

  # Fallback
  { url = "*/", fg = "#95e6cb" }, # cy
  { url = "*", is = "exec", fg = "#aad94c" }, # gr
  { url = "*", fg = "#cbccc6" } # tx
]

[icon]
dirs = [
  { name = ".config", text = "", fg = "#95e6cb" }, # cy
  { name = ".git", text = "", fg = "#95e6cb" }, # cy
  { name = ".github", text = "", fg = "#95e6cb" }, # cy
  { name = ".npm", text = "", fg = "#95e6cb" }, # cy
  { name = "Desktop", text = "", fg = "#95e6cb" }, # cy
  { name = "Development", text = "", fg = "#95e6cb" }, # cy
  { name = "Documents", text = "", fg = "#95e6cb" }, # cy
  { name = "Downloads", text = "", fg = "#95e6cb" }, # cy
  { name = "Library", text = "", fg = "#95e6cb" }, # cy
  { name = "Movies", text = "", fg = "#95e6cb" }, # cy
  { name = "Music", text = "", fg = "#95e6cb" }, # cy
  { name = "Pictures", text = "", fg = "#95e6cb" }, # cy
  { name = "Public", text = "", fg = "#95e6cb" }, # cy
  { name = "Videos", text = "", fg = "#95e6cb" } # cy
]
conds = [
  # Special files
  { if = "orphan", text = "", fg = "#f28779" }, # re
  { if = "link", text = "", fg = "#95e6cb" }, # cy
  { if = "block", text = "", fg = "#cbccc6" }, # tx
  { if = "char", text = "", fg = "#cbccc6" }, # tx
  { if = "fifo", text = "", fg = "#d4bfff" }, # ma
  { if = "sock", text = "", fg = "#d4bfff" }, # ma
  { if = "sticky", text = "", fg = "#cbccc6" }, # tx
  { if = "dummy", text = "", fg = "#f28779" }, # re

  # Fallback
  { if = "dir", text = "", fg = "#95e6cb" }, # cy
  { if = "exec", text = "", fg = "#aad94c" }, # gr
  { if = "!dir", text = "", fg = "#cbccc6" } # tx
]
