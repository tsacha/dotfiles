# Local Tomorrow Night Yazi flavor.
# Color palette: Tomorrow Night
# ---
# black0      "#1d1f21" bg
# black1      "#282a2e" bg-2
# black2      "#373b41" ui
# black3      "#4b4f54" ui-2
# black4      "#969896" tx-3
# black5      "#b4b7b4" tx-2-hi
# white       "#c5c8c6" tx
# surface     "#4b4f54" ui-3
# red         "#cc6666" re
# orange      "#de935f" or
# yellow      "#f0c674" ye
# green       "#b5bd68" gr
# cyan        "#8abeb7" cy
# blue        "#81a2be" bl
# magenta     "#b294bb" ma

[app]
overall = { bg = "#1d1f21" } # bg

[mgr]
cwd = { fg = "#8abeb7", bold = true } # cy
hovered = { fg = "#1d1f21", bg = "#8abeb7", bold = true } # bg, cy

# Find
find_keyword = { fg = "#f0c674", bold = true, italic = true, underline = true } # ye
find_position = { fg = "#b294bb", bg = "reset", bold = true, italic = true } # ma
symlink_target = { italic = true }

# Marker
marker_copied = { fg = "#b5bd68", bg = "#b5bd68" } # gr, gr
marker_cut = { fg = "#cc6666", bg = "#cc6666" } # re, re
marker_marked = { fg = "#8abeb7", bg = "#8abeb7" } # cy, cy
marker_selected = { fg = "#f0c674", bg = "#f0c674" } # ye, ye

# Count
count_copied = { fg = "#1d1f21", bg = "#b5bd68", bold = true } # bg, gr
count_cut = { fg = "#1d1f21", bg = "#cc6666", bold = true } # bg, re
count_selected = { fg = "#1d1f21", bg = "#f0c674", bold = true } # bg, ye

# Border
border_symbol = "│"
border_style = { fg = "#373b41" } # ui
syntect_theme = ""

[indicator]
parent = { underline = true }
current = { fg = "#c5c8c6", bg = "#373b41" } # tx, ui
preview = { underline = true }
padding = { open = "█", close = "█" }

[tabs]
active = { fg = "#1d1f21", bg = "#8abeb7", bold = true } # bg, cy
inactive = { fg = "#8abeb7", bg = "#282a2e" } # cy, bg-2
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
# Normal mode
normal_main = { fg = "#1d1f21", bg = "#8abeb7", bold = true } # bg, cy
normal_alt = { fg = "#1d1f21", bg = "#c5c8c6", bold = true } # bg, tx

# Select mode
select_main = { fg = "#1d1f21", bg = "#cc6666", bold = true } # bg, re
select_alt = { fg = "#1d1f21", bg = "#c5c8c6", bold = true } # bg, tx

# Unset mode
unset_main = { fg = "#1d1f21", bg = "#cc6666", bold = true } # bg, re
unset_alt = { fg = "#1d1f21", bg = "#c5c8c6", bold = true } # bg, tx

[status]
overall = { fg = "#c5c8c6" } # tx

# Permissions
perm_type = { fg = "#81a2be" } # bl
perm_read = { fg = "#f0c674" } # ye
perm_write = { fg = "#cc6666" } # re
perm_exec = { fg = "#b5bd68" } # gr
perm_sep = { fg = "#969896" } # tx-2

# Progress
progress_label = { fg = "#c5c8c6", bold = true } # tx
progress_normal = { fg = "#8abeb7", bg = "#282a2e" } # cy, bg-2
progress_error = { fg = "#cc6666", bg = "#282a2e" } # re, bg-2

[which]
cols = 3
mask = { bg = "#282a2e" } # bg-2
cand = { fg = "#8abeb7", bold = true } # cy
rest = { fg = "#969896", italic = true } # tx-2
desc = { fg = "#f0c674" } # ye
separator = " "
separator_style = { }

[confirm]
border = { fg = "#4b4f54" } # ui-2
title = { fg = "#cc6666", bold = true } # re
body = { fg = "#c5c8c6" } # tx
list = { fg = "#c5c8c6" } # tx
btn_yes = { fg = "#1d1f21", bg = "#8abeb7", bold = true } # bg, cy
btn_no = { fg = "#1d1f21", bg = "#c5c8c6", bold = true } # bg, tx

[spot]
border = { fg = "#4b4f54" } # ui-2
title = { fg = "#8abeb7", bold = true } # cy
tbl_col = { fg = "#8abeb7" } # cy
tbl_cell = { fg = "#1d1f21", bg = "#f0c674", bold = true } # bg, ye

[notify]
# Notification title
title_info = { fg = "#81a2be" } # bl
title_warn = { fg = "#de935f" } # or
title_error = { fg = "#cc6666" } # re

[pick]
border = { fg = "#8abeb7", bold = true } # cy
active = { fg = "#b294bb", bold = true } # ma
inactive = { fg = "#969896" } # tx-2

[input]
border = { fg = "#8abeb7" } # cy
title = { fg = "#c5c8c6", bold = true } # tx
value = { fg = "#c5c8c6" } # tx
selected = { reversed = true } # tx, bg

[cmp]
border = { fg = "#8abeb7", bold = true } # cy
active = { fg = "#1d1f21", bg = "#c5c8c6", bold = true } # bg, tx
inactive = { fg = "#969896" } # tx-2

[tasks]
border = { fg = "#8abeb7" } # cy
title = { fg = "#c5c8c6", bold = true } # tx
hovered = { fg = "#b294bb", bold = true, reversed = true } # ma

[help]
on = { fg = "#81a2be" } # bl
run = { fg = "#8abeb7" } # cy
desc = { fg = "#f0c674", italic = true } # ye
hovered = { reversed = true, bold = true }
footer = { fg = "#1d1f21", bg = "#c5c8c6", bold = true } # bg, tx

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#b294bb" }, # ma

  # Media
  { mime = "{audio,video}/*", fg = "#f0c674" }, # ye

  # Archives
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#cc6666" }, # re

  # Documents
  { mime = "application/{pdf,doc,rtf}", fg = "#de935f" }, # or

  # Empty files
  { mime = "inode/empty", fg = "#969896" }, # tx-3

  # Special files
  { url = "*", is = "orphan", fg = "#1d1f21", bg = "#cc6666" }, # bg, re
  { url = "*/", is = "orphan", fg = "#1d1f21", bg = "#cc6666" }, # bg, re
  { url = "*", is = "link", fg = "#8abeb7" }, # cy
  { url = "*/", is = "link", fg = "#8abeb7" }, # cy
  { url = "*", is = "block", fg = "#c5c8c6" }, # tx
  { url = "*", is = "char", fg = "#c5c8c6" }, # tx
  { url = "*", is = "fifo", fg = "#b294bb" }, # ma
  { url = "*", is = "sock", fg = "#b294bb" }, # ma
  { url = "*", is = "sticky", fg = "#c5c8c6" }, # tx
  { url = "*", is = "dummy", fg = "#1d1f21", bg = "#cc6666" }, # bg, re
  { url = "*/", is = "dummy", fg = "#1d1f21", bg = "#cc6666" }, # bg, re

  # Fallback
  { url = "*/", fg = "#8abeb7" }, # cy
  { url = "*", is = "exec", fg = "#b5bd68" }, # gr
  { url = "*", fg = "#c5c8c6" } # tx
]

[icon]
dirs = [
  { name = ".config", text = "", fg = "#8abeb7" }, # cy
  { name = ".git", text = "", fg = "#8abeb7" }, # cy
  { name = ".github", text = "", fg = "#8abeb7" }, # cy
  { name = ".npm", text = "", fg = "#8abeb7" }, # cy
  { name = "Desktop", text = "", fg = "#8abeb7" }, # cy
  { name = "Development", text = "", fg = "#8abeb7" }, # cy
  { name = "Documents", text = "", fg = "#8abeb7" }, # cy
  { name = "Downloads", text = "", fg = "#8abeb7" }, # cy
  { name = "Library", text = "", fg = "#8abeb7" }, # cy
  { name = "Movies", text = "", fg = "#8abeb7" }, # cy
  { name = "Music", text = "", fg = "#8abeb7" }, # cy
  { name = "Pictures", text = "", fg = "#8abeb7" }, # cy
  { name = "Public", text = "", fg = "#8abeb7" }, # cy
  { name = "Videos", text = "", fg = "#8abeb7" } # cy
]
conds = [
  # Special files
  { if = "orphan", text = "", fg = "#cc6666" }, # re
  { if = "link", text = "", fg = "#8abeb7" }, # cy
  { if = "block", text = "", fg = "#c5c8c6" }, # tx
  { if = "char", text = "", fg = "#c5c8c6" }, # tx
  { if = "fifo", text = "", fg = "#b294bb" }, # ma
  { if = "sock", text = "", fg = "#b294bb" }, # ma
  { if = "sticky", text = "", fg = "#c5c8c6" }, # tx
  { if = "dummy", text = "", fg = "#cc6666" }, # re

  # Fallback
  { if = "dir", text = "", fg = "#8abeb7" }, # cy
  { if = "exec", text = "", fg = "#b5bd68" }, # gr
  { if = "!dir", text = "", fg = "#c5c8c6" } # tx
]
