# Local Ayu Light Yazi flavor.
# Color palette: Ayu Light
# ---
# black0      "#fafafa" bg
# black1      "#f3f4f5" bg-2
# black2      "#e7e8e9" ui
# black3      "#d9d8d7" ui-2
# black4      "#a1a6b3" tx-3
# black5      "#4d5566" tx-2
# white       "#5c6166" tx
# surface     "#8a9199" ui-3
# red         "#f07171" re
# orange      "#ff8f40" or
# yellow      "#f2ae49" ye
# green       "#86b300" gr
# cyan        "#4cbf99" cy
# blue        "#399ee6" bl
# magenta     "#a37acc" ma

[app]
overall = { bg = "#fafafa" } # bg

[mgr]
cwd = { fg = "#4cbf99", bold = true } # cy
hovered = { fg = "#fafafa", bg = "#4cbf99", bold = true } # bg, cy

# Find
find_keyword = { fg = "#f2ae49", bold = true, italic = true, underline = true } # ye
find_position = { fg = "#a37acc", bg = "reset", bold = true, italic = true } # ma
symlink_target = { italic = true }

# Marker
marker_copied = { fg = "#86b300", bg = "#86b300" } # gr, gr
marker_cut = { fg = "#f07171", bg = "#f07171" } # re, re
marker_marked = { fg = "#4cbf99", bg = "#4cbf99" } # cy, cy
marker_selected = { fg = "#f2ae49", bg = "#f2ae49" } # ye, ye

# Count
count_copied = { fg = "#fafafa", bg = "#86b300", bold = true } # bg, gr
count_cut = { fg = "#fafafa", bg = "#f07171", bold = true } # bg, re
count_selected = { fg = "#5c6166", bg = "#f2ae49", bold = true } # tx, ye

# Border
border_symbol = "│"
border_style = { fg = "#e7e8e9" } # ui
syntect_theme = ""

[indicator]
parent = { underline = true }
current = { fg = "#5c6166", bg = "#e7e8e9" } # tx, ui
preview = { underline = true }
padding = { open = "█", close = "█" }

[tabs]
active = { fg = "#fafafa", bg = "#4cbf99", bold = true } # bg, cy
inactive = { fg = "#4cbf99", bg = "#f3f4f5" } # cy, bg-2
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
# Normal mode
normal_main = { fg = "#fafafa", bg = "#4cbf99", bold = true } # bg, cy
normal_alt = { fg = "#fafafa", bg = "#5c6166", bold = true } # bg, tx

# Select mode
select_main = { fg = "#fafafa", bg = "#f07171", bold = true } # bg, re
select_alt = { fg = "#fafafa", bg = "#5c6166", bold = true } # bg, tx

# Unset mode
unset_main = { fg = "#fafafa", bg = "#f07171", bold = true } # bg, re
unset_alt = { fg = "#fafafa", bg = "#5c6166", bold = true } # bg, tx

[status]
overall = { fg = "#5c6166" } # tx

# Permissions
perm_type = { fg = "#399ee6" } # bl
perm_read = { fg = "#f2ae49" } # ye
perm_write = { fg = "#f07171" } # re
perm_exec = { fg = "#86b300" } # gr
perm_sep = { fg = "#4d5566" } # tx-2

# Progress
progress_label = { fg = "#5c6166", bold = true } # tx
progress_normal = { fg = "#4cbf99", bg = "#f3f4f5" } # cy, bg-2
progress_error = { fg = "#f07171", bg = "#f3f4f5" } # re, bg-2

[which]
cols = 3
mask = { bg = "#f3f4f5" } # bg-2
cand = { fg = "#4cbf99", bold = true } # cy
rest = { fg = "#4d5566", italic = true } # tx-2
desc = { fg = "#f2ae49" } # ye
separator = " "
separator_style = { }

[confirm]
border = { fg = "#d9d8d7" } # ui-2
title = { fg = "#f07171", bold = true } # re
body = { fg = "#5c6166" } # tx
list = { fg = "#5c6166" } # tx
btn_yes = { fg = "#fafafa", bg = "#4cbf99", bold = true } # bg, cy
btn_no = { fg = "#fafafa", bg = "#5c6166", bold = true } # bg, tx

[spot]
border = { fg = "#d9d8d7" } # ui-2
title = { fg = "#4cbf99", bold = true } # cy
tbl_col = { fg = "#4cbf99" } # cy
tbl_cell = { fg = "#5c6166", bg = "#f2ae49", bold = true } # tx, ye

[notify]
# Notification title
title_info = { fg = "#399ee6" } # bl
title_warn = { fg = "#ff8f40" } # or
title_error = { fg = "#f07171" } # re

[pick]
border = { fg = "#4cbf99", bold = true } # cy
active = { fg = "#a37acc", bold = true } # ma
inactive = { fg = "#4d5566" } # tx-2

[input]
border = { fg = "#4cbf99" } # cy
title = { fg = "#5c6166", bold = true } # tx
value = { fg = "#5c6166" } # tx
selected = { reversed = true } # tx, bg

[cmp]
border = { fg = "#4cbf99", bold = true } # cy
active = { fg = "#fafafa", bg = "#5c6166", bold = true } # bg, tx
inactive = { fg = "#4d5566" } # tx-2

[tasks]
border = { fg = "#4cbf99" } # cy
title = { fg = "#5c6166", bold = true } # tx
hovered = { fg = "#a37acc", bold = true, reversed = true } # ma

[help]
on = { fg = "#399ee6" } # bl
run = { fg = "#4cbf99" } # cy
desc = { fg = "#f2ae49", italic = true } # ye
hovered = { reversed = true, bold = true }
footer = { fg = "#fafafa", bg = "#5c6166", bold = true } # bg, tx

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#a37acc" }, # ma

  # Media
  { mime = "{audio,video}/*", fg = "#f2ae49" }, # ye

  # Archives
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f07171" }, # re

  # Documents
  { mime = "application/{pdf,doc,rtf}", fg = "#ff8f40" }, # or

  # Empty files
  { mime = "inode/empty", fg = "#a1a6b3" }, # tx-3

  # Special files
  { url = "*", is = "orphan", fg = "#fafafa", bg = "#f07171" }, # bg, re
  { url = "*/", is = "orphan", fg = "#fafafa", bg = "#f07171" }, # bg, re
  { url = "*", is = "link", fg = "#4cbf99" }, # cy
  { url = "*/", is = "link", fg = "#4cbf99" }, # cy
  { url = "*", is = "block", fg = "#5c6166" }, # tx
  { url = "*", is = "char", fg = "#5c6166" }, # tx
  { url = "*", is = "fifo", fg = "#a37acc" }, # ma
  { url = "*", is = "sock", fg = "#a37acc" }, # ma
  { url = "*", is = "sticky", fg = "#5c6166" }, # tx
  { url = "*", is = "dummy", fg = "#fafafa", bg = "#f07171" }, # bg, re
  { url = "*/", is = "dummy", fg = "#fafafa", bg = "#f07171" }, # bg, re

  # Fallback
  { url = "*/", fg = "#4cbf99" }, # cy
  { url = "*", is = "exec", fg = "#86b300" }, # gr
  { url = "*", fg = "#5c6166" } # tx
]

[icon]
dirs = [
  { name = ".config", text = "", fg = "#4cbf99" }, # cy
  { name = ".git", text = "", fg = "#4cbf99" }, # cy
  { name = ".github", text = "", fg = "#4cbf99" }, # cy
  { name = ".npm", text = "", fg = "#4cbf99" }, # cy
  { name = "Desktop", text = "", fg = "#4cbf99" }, # cy
  { name = "Development", text = "", fg = "#4cbf99" }, # cy
  { name = "Documents", text = "", fg = "#4cbf99" }, # cy
  { name = "Downloads", text = "", fg = "#4cbf99" }, # cy
  { name = "Library", text = "", fg = "#4cbf99" }, # cy
  { name = "Movies", text = "", fg = "#4cbf99" }, # cy
  { name = "Music", text = "", fg = "#4cbf99" }, # cy
  { name = "Pictures", text = "", fg = "#4cbf99" }, # cy
  { name = "Public", text = "", fg = "#4cbf99" }, # cy
  { name = "Videos", text = "", fg = "#4cbf99" } # cy
]
conds = [
  # Special files
  { if = "orphan", text = "", fg = "#f07171" }, # re
  { if = "link", text = "", fg = "#4cbf99" }, # cy
  { if = "block", text = "", fg = "#5c6166" }, # tx
  { if = "char", text = "", fg = "#5c6166" }, # tx
  { if = "fifo", text = "", fg = "#a37acc" }, # ma
  { if = "sock", text = "", fg = "#a37acc" }, # ma
  { if = "sticky", text = "", fg = "#5c6166" }, # tx
  { if = "dummy", text = "", fg = "#f07171" }, # re

  # Fallback
  { if = "dir", text = "", fg = "#4cbf99" }, # cy
  { if = "exec", text = "", fg = "#86b300" }, # gr
  { if = "!dir", text = "", fg = "#5c6166" } # tx
]
