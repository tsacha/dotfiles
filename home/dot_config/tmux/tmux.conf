set -s escape-time 0
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ",xterm-ghostty:hyperlinks"
source-file ~/.config/tmux/theme.conf

set -g prefix M-q
bind M-t send-prefix

set -g mouse on
bind -n WheelUpPane if -F '#{alternate_on}' 'send-keys Up' 'if -F "#{mouse_any_flag}" "send -M" "copy-mode -e; send-keys -M"'
bind -n WheelDownPane if -F '#{alternate_on}' 'send-keys Down' 'send-keys -M'

# run-shell because -t targets never expand formats; the spawned shell has no
# current client and no $TMUX, hence -c/-S.
bind -n MouseDown1Status if -F '#{!=:#{mouse_status_range},}' {
	run-shell 'tmux -S #{q:socket_path} switch-client -c #{q:client_tty} -t #{q:mouse_status_range}'
}

set -g status-interval 5
set -g automatic-rename on
# #{session_name} is empty here; the root-of-project glyph lives in the theme.
set -g automatic-rename-format '#{?#{==:#{pane_current_command},fish},#{b:pane_current_path},#{pane_current_command}}'

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

set-hook -g after-split-window 'select-layout -E'
set-hook -g pane-exited 'select-layout -E'

set -g detach-on-destroy off

set -g status on
bind -n M-B set status

# Refresh the final status-bar separator when sessions change.
set-hook -g session-created { run-shell '~/.config/tmux/sessions.fish refresh #{q:socket_path}' }
set-hook -g session-closed { run-shell '~/.config/tmux/sessions.fish refresh #{q:socket_path}' }
set-hook -g session-renamed { run-shell '~/.config/tmux/sessions.fish refresh #{q:socket_path}' }
run-shell '~/.config/tmux/sessions.fish refresh #{q:socket_path}'

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-t new-window -a -c "#{pane_current_path}"
bind -n M-r next-window
bind -n M-n previous-window

# Mark the current client session in status-bar order (scratch, then IDs).
# Duplicate the ring so both directions wrap, including a single session.
set -g @session-ring '#{S:#{?#{==:#{session_name},scratch},#{?#{==:#{session_name},#{client_session}},>,}#{session_id} ,}}#{S:#{?#{==:#{session_name},scratch},,#{?#{==:#{session_name},#{client_session}},>,}#{session_id} }}'
set -g @session-next '#{s|.*>[$][0-9]+ >?([$][0-9]+).*|\1|:#{E:@session-ring}#{E:@session-ring}}'
set -g @session-prev '#{s|.*([$][0-9]+) >[$][0-9]+ .*|\1|:#{E:@session-ring}#{E:@session-ring}}'
# -C executes inside tmux: no shell expansion, stale snapshot or lost repeat keys.
bind -r r run-shell -C 'switch-client -t #{E:@session-next}'
bind -r n run-shell -C 'switch-client -t #{E:@session-next}'
bind -r p run-shell -C 'switch-client -t #{E:@session-prev}'
bind -n M-Tab run-shell -C 'switch-client -t #{E:@session-next}'
bind -n M-BTab run-shell -C 'switch-client -t #{E:@session-prev}'

bind -n M-s display-popup -E -B -w 60% -h 60% "fish -c s"

bind f display-popup -E -B -w 80% -h 80% -d "#{pane_current_path}"

bind -n M-Space copy-mode

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none
set -g focus-events on

set -g status-position top
set -g display-panes-time 2000
set -g clock-mode-style 24

setw -g mode-keys vi
bind -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X scroll-down
